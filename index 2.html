<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1c1e;--sub:#9a9a9f;--ac:#1c1c1e;--act:#fff;--line:#ebe9e4;--w1:#dcd6ee;--w2:#f4e8e2}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#1a1a1d;--tx:#f2f2f2;--sub:#78787d;--ac:#f2f2f2;--act:#111;--line:#26262a;--w1:#1d1d2e;--w2:#0e0e10}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:#cfcdc8;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px/1.55 -apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--tx)}
@media(prefers-color-scheme:dark){body{background:#050506}}
#ph{width:390px;height:790px;max-height:100vh;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 0 0 8px #111,0 30px 80px #0005}
@media(max-width:500px){body{display:block}#ph{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
#main{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:env(safe-area-inset-top,0px)}
.hd{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;padding:8px 10px;font-weight:600;text-align:center}
.hd>*:last-child{text-align:right}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{padding:6px;display:inline-flex;opacity:.85}
.body{flex:1;overflow:auto;padding:4px 16px 16px}
#home{flex:1;padding:70px 28px;background:linear-gradient(165deg,var(--w1),var(--w2))}
#home h1{font-size:60px;font-weight:200;letter-spacing:-2px}#home p{color:var(--sub);margin-top:-4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 10px;margin-top:56px}
.ic{text-align:center;font-size:11px;color:var(--sub);cursor:pointer}
.ic i{display:flex;width:56px;height:56px;margin:0 auto 7px;border-radius:18px;align-items:center;justify-content:center;background:#ffffff66;backdrop-filter:blur(14px);color:var(--tx);box-shadow:0 1px 0 #fff8 inset}
@media(prefers-color-scheme:dark){.ic i{background:#ffffff12}}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row>div:nth-child(2){flex:1;min-width:0}
.av{border-radius:50%;background:var(--line);color:var(--sub);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;font-weight:500}
.av img{width:100%;height:100%;object-fit:cover}
.sub{color:var(--sub);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;padding:8px 16px}
.m{display:flex;gap:8px;margin-bottom:10px;align-items:flex-end}.m.me{flex-direction:row-reverse}
.bb{max-width:72%;padding:9px 14px;border-radius:18px 18px 18px 4px;background:var(--card);white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
.me .bb{background:var(--ac);color:var(--act);border:0;border-radius:18px 18px 4px 18px}
.bar{display:flex;gap:8px;padding:10px 14px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
input,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--sub)}
.bar input{border-radius:22px}
.send{background:var(--ac);color:var(--act);border-radius:22px;padding:0 18px}
.tw{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tw>div:last-child{flex:1;min-width:0}.tw b{margin-right:6px}
.rp{margin-top:8px;padding:8px 12px;background:var(--card);border-radius:12px;font-size:13px;border:1px solid var(--line)}
.ov{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:9;backdrop-filter:blur(3px)}
.sh{background:var(--bg);width:100%;max-height:88%;overflow:auto;padding:20px 20px 26px;border-radius:26px 26px 0 0}
.sh label{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px;letter-spacing:.5px}
.sh .ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--tx)}.sh .ck input{width:auto}
.pri{background:var(--ac);color:var(--act);border-radius:14px;padding:12px;width:100%;margin-top:14px}
.pri.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}.pri.d{background:var(--card);color:#d9534f;border:1px solid var(--line)}
.tag{font-size:10px;border:1px solid var(--sub);color:var(--sub);border-radius:6px;padding:0 6px;margin-left:8px}
.ctr{text-align:center;padding:20px 0}
.up{display:flex;align-items:center;gap:14px}.up input{display:none}
.up span{font-size:13px;color:var(--sub);border:1px solid var(--line);border-radius:12px;padding:6px 14px;cursor:pointer}

.ib{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;align-items:center;justify-content:center;padding:0;background:var(--card)}
.ic i{background:linear-gradient(#fff,#ececec)!important;box-shadow:0 6px 16px #0002,0 1px 0 #fff inset!important;color:#000}
.lt{font-size:34px;font-weight:800;margin:6px 4px 16px;letter-spacing:1px}
.cd{background:var(--card);border-radius:28px;margin-bottom:22px;overflow:hidden}
.sr{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--tx)}
.cd .sr:last-child{border:0}.sr span{flex:none}.sr .pf{padding:18px}
.sr input{flex:1;min-width:0;border:0;background:none;text-align:right;padding:4px 0;color:var(--sub)}
.sr svg:last-child{color:var(--sub)}
.ti{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff,#ececec);border:1px solid #e2e2e2;flex:none}
.sh .ck input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#e5e5ea;border:1px solid var(--line);position:relative;padding:0;cursor:pointer}
.sh .ck input:before{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#000;transition:.2s}
.sh .ck input:checked{background:#000}.sh .ck input:checked:before{left:20px;background:#fff}

.hd{display:flex;justify-content:space-between;align-items:center;padding:6px 16px}
.hd.c{display:grid;grid-template-columns:60px 1fr 60px;text-align:center;font-weight:600}
.rt{display:flex;gap:8px}
.cd .row{padding:13px 18px;gap:14px}.cd .row:last-child{border:0}.row>div:only-child{flex:1}
.cd .row:active,.sr:active{background:var(--bg)}
.tw{background:var(--card);border-radius:24px;padding:16px;margin-bottom:14px;border:0;box-shadow:0 2px 12px #0000000a}
.rp{border:0;background:var(--bg)}
#home{padding-top:60px;background:radial-gradient(circle at 15% 10%,#ffd6e7,transparent 45%),radial-gradient(circle at 90% 28%,#c9ddff,transparent 50%),radial-gradient(circle at 45% 100%,#e4d8ff,transparent 55%),var(--bg)}
@media(prefers-color-scheme:dark){#home{background:radial-gradient(circle at 15% 10%,#3a2040,transparent 45%),radial-gradient(circle at 90% 28%,#1c2c52,transparent 50%),radial-gradient(circle at 45% 100%,#2a2050,transparent 55%),var(--bg)}}
.wg{display:flex;margin-top:26px;background:#ffffff80;backdrop-filter:blur(20px);border-radius:24px;padding:16px 8px;box-shadow:0 8px 30px #0000000d}
@media(prefers-color-scheme:dark){.wg{background:#ffffff10}}
.wg div{flex:1;text-align:center}.wg b{display:block;font-size:26px;font-weight:300}.wg span{font-size:11px;color:var(--sub)}
.grid{margin-top:34px!important}
.bar{margin:0 14px 14px;padding:6px 6px 6px 8px;background:var(--card);border-radius:28px;box-shadow:0 8px 28px #0000001a}
.bar input{border:0;background:none}.send{height:40px}
.bb{border:0;box-shadow:0 1px 4px #0000000f}
.msgs{padding-bottom:4px}
